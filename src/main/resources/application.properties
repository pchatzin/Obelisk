# =========================
# H2 database (file-based persistence)
# =========================
spring.datasource.url=jdbc:h2:file:./data/budgetdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server binding
server.address=0.0.0.0

# =========================
# Budget PDF & CSV paths
# =========================
budget.pdf.path=src/main/resources/budget-2025.pdf
# Το CSV θα δημιουργηθεί στον φάκελο "budget" στο root του project
budget.csv.path=budget/budget2025.csv
